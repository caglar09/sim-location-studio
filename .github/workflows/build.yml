name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS' || runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Build bundled physical iOS bridge
        if: (runner.os == 'macOS' || runner.os == 'Windows') && github.event_name == 'push'
        run: npm run build:ios-bridge
      - run: npm run typecheck
      - run: npm run build
      - name: Package desktop app
        if: github.event_name == 'push'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --publish never
      - name: Upload distributables
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sim-location-studio-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android-companion :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sim-location-companion-android
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
