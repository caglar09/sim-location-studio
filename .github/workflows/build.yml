name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  hydrate-icon:
    runs-on: ubuntu-latest
    outputs:
      hydrated: ${{ steps.icon.outputs.hydrated }}
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate app icon
        id: icon
        shell: bash
        run: |
          echo "hydrated=false" >> "$GITHUB_OUTPUT"
          if [ ! -f .icon-payload/READY ]; then
            exit 0
          fi
          mkdir -p build
          cat .icon-payload/part-* | base64 --decode > build/icon.png
          rm -rf .icon-payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/icon.png .icon-payload
          git commit -m "feat: add Sim Location Studio app icon"
          git push
          echo "hydrated=true" >> "$GITHUB_OUTPUT"

  build:
    needs: hydrate-icon
    if: needs.hydrate-icon.outputs.hydrated != 'true'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Package desktop app
        if: github.event_name == 'push'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --publish never
      - name: Upload distributables
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sim-location-studio-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
