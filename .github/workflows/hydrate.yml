name: Hydrate initial project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hydrate:
    if: ${{ hashFiles('bootstrap.mjs') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hydrate project
        run: node bootstrap.mjs
      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initial Sim Location Studio application"
          git push
